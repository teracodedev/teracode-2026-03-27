# 上流: docker compose の nginx は network_mode: host のため 127.0.0.1 = ホストの PM2 (3000)。
# （ブリッジのみのコンテナなら host.docker.internal が必要で、127.0.0.1 だけでは 502 になる。）

# レスポンスヘッダー・エラーページに nginx のバージョンを出さない
server_tokens off;

# TLS の共通設定（ホスト名で振り分ける前の段階では default_server の設定が使われるため、全 server 共通にしておく）
ssl_protocols TLSv1.2 TLSv1.3;
ssl_prefer_server_ciphers off;
ssl_session_cache shared:SSL:10m;
ssl_session_timeout 1d;
ssl_session_tickets off;

# ログイン試行の総当たり対策（IP ごと）。アプリ側でもアカウント・IP 単位で試行回数を制限している
limit_req_zone $binary_remote_addr zone=teracode_login:10m rate=10r/m;
limit_req_status 429;

# 通常の HTTP では Connection: upgrade を付けない（常時 upgrade は上流がおかしくなり 502 の原因になり得る）
map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

# server_name に一致しないホスト名（IP 直打ち・別ドメインの向け先・スキャナ）には応答しない
server {
  listen 80 default_server;
  server_name _;
  return 444;
}

server {
  listen 443 ssl default_server;
  server_name _;
  ssl_reject_handshake on;
}

# HTTP → HTTPS リダイレクト（Let's Encrypt の認証も通す）
server {
  listen 80;
  server_name teracode6.zenpoji.or.jp;

  # Let's Encrypt 認証用
  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }

  location / {
    return 301 https://$host$request_uri;
  }
}

# HTTPS
server {
  listen 443 ssl;
  http2 on;
  server_name teracode6.zenpoji.or.jp;

  # Let's Encrypt 証明書
  ssl_certificate     /etc/letsencrypt/live/teracode6.zenpoji.or.jp/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/teracode6.zenpoji.or.jp/privkey.pem;

  # 大きなファイルを受け取るのはインポート・リカバリーだけ（下の location で 50MB まで許可）
  client_max_body_size 2m;

  # location 側で proxy_set_header を書くとここの設定は引き継がれないため、location には書かないこと
  proxy_http_version 1.1;
  proxy_set_header Upgrade $http_upgrade;
  proxy_set_header Connection $connection_upgrade;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header X-Forwarded-Host $host;

  # add_header は、自前の add_header を持つ location には引き継がれない。各 location にも同じ行を書くこと
  add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

  # ファイル名にハッシュが付くため長期キャッシュ可。HTML が古いままだと ChunkLoadError の原因になる。
  location ^~ /_next/static/ {
    proxy_pass http://127.0.0.1:3000;
    proxy_hide_header Cache-Control;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
  }

  # ログイン（独自フォーム / NextAuth の Credentials）
  location = /api/login {
    limit_req zone=teracode_login burst=10 nodelay;
    proxy_pass http://127.0.0.1:3000;
    proxy_hide_header Cache-Control;
    add_header Cache-Control "no-store" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
  }

  location ^~ /api/auth/callback/ {
    limit_req zone=teracode_login burst=10 nodelay;
    proxy_pass http://127.0.0.1:3000;
    proxy_hide_header Cache-Control;
    add_header Cache-Control "no-store" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
  }

  # MDB / YAML インポート・バックアップからのリカバリー（管理者のみ。アプリ側で権限を確認する）
  location ~ ^/api/(import|backup/restore)(/|$) {
    client_max_body_size 50m;
    proxy_pass http://127.0.0.1:3000;
    proxy_buffering off;
    proxy_hide_header Cache-Control;
    add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    add_header Pragma "no-cache" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
  }

  # HTML / RSC / API はキャッシュさせない（デプロイ後も古いチャンク参照を防ぐ）
  location / {
    proxy_pass http://127.0.0.1:3000;

    # RSC / ストリーミング応答でバッファが原因の切断を減らす
    proxy_buffering off;

    proxy_hide_header Cache-Control;
    add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    add_header Pragma "no-cache" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
  }
}
